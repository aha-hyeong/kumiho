name: Release

on:
  push:
    tags:
      - "v*"

env:
  DOCKER_IMAGE: ahahyeong/kumiho

jobs:
  validate-release:
    name: Validate Release Tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag against branch policy
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"

          git fetch origin main dev --force

          if [[ "$VERSION" == *beta* ]]; then
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/dev; then
              echo "Beta tag must point to a commit contained in origin/dev."
              exit 1
            fi

            if git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Beta tag must not point to a commit already contained in origin/main."
              exit 1
            fi
          else
            if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
              echo "Stable tag must point to a commit contained in origin/main."
              exit 1
            fi
          fi

  # Docker Build
  docker:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: [validate-release]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_SUMMARY: "false"
          DOCKER_BUILD_RECORD_UPLOAD: "false"
        with:
          context: .
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ steps.version.outputs.VERSION }}
            ${{ contains(steps.version.outputs.VERSION, 'beta') && format('{0}:beta', env.DOCKER_IMAGE) || format('{0}:latest', env.DOCKER_IMAGE) }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # GitHub Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [docker]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'beta') }}
          make_latest: ${{ contains(github.ref_name, 'beta') && 'false' || 'legacy' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
